name: Auto PR to develop

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR and merge into develop when mergeable
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const base = 'develop';
            const { owner, repo } = context.repo;

            if (branch === 'main' || branch === 'develop') {
              core.info('main/develop 브랜치는 자동 PR 대상이 아닙니다.');
              return;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base,
              state: 'open',
            });

            let pr;
            if (prs.length === 0) {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                title: `[${branch}] → develop`,
                head: branch,
                base,
                body: [
                  '## 자동 PR',
                  '',
                  `브랜치 \`${branch}\`의 변경사항을 \`develop\`에 반영합니다.`,
                  '',
                  `- 커밋: \`${context.sha.substring(0, 7)}\``,
                  `- 푸시: ${new Date().toISOString()}`,
                  '',
                  '충돌이 없으면 GitHub Actions가 자동으로 squash merge합니다.',
                  '충돌이 있으면 PR은 열린 채로 남고 머지되지 않습니다.',
                ].join('\n'),
              });
              pr = data;
              core.info(`Created PR #${pr.number}`);
            } else {
              pr = prs[0];
              core.info(`PR #${pr.number} already open — push로 PR이 갱신됩니다.`);
            }

            async function getMergeability(pullNumber) {
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullNumber,
                });
                if (data.mergeable !== null) return data;
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
              return github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              }).then((res) => res.data);
            }

            const prDetails = await getMergeability(pr.number);

            if (prDetails.mergeable === false || prDetails.mergeable_state === 'dirty') {
              core.setFailed(
                `PR #${pr.number}에 충돌이 있어 자동 머지를 건너뜁니다. ` +
                  '충돌을 해결한 뒤 다시 push하세요.'
              );
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `[${branch}] → develop`,
              });
              core.info(`Merged PR #${pr.number} into ${base}`);
            } catch (error) {
              core.setFailed(
                `PR #${pr.number} 머지 실패: ${error.message}\n` +
                  '충돌 해결 또는 develop 브랜치 보호 규칙을 확인하세요.'
              );
            }
