name: Auto PR to main

on:
  push:
    branches:
      - dev-jin
      - dev-jun
      - dev-hyun

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base: 'main',
              state: 'open',
            });

            let pr;
            if (prs.length === 0) {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                title: `[${branch}] → main`,
                head: branch,
                base: 'main',
                body: [
                  '## 자동 PR',
                  '',
                  `브랜치 \`${branch}\`의 변경사항을 \`main\`에 반영합니다.`,
                  '',
                  `- 커밋: \`${context.sha.substring(0, 7)}\``,
                  `- 푸시: ${new Date().toISOString()}`,
                  '',
                  'CI 통과 후 auto-merge가 활성화되어 있으면 자동으로 머지됩니다.',
                ].join('\n'),
              });
              pr = data;
              core.info(`Created PR #${pr.number}`);
            } else {
              pr = prs[0];
              core.info(`PR #${pr.number} already open — push로 PR이 갱신됩니다.`);
            }

            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(
                    input: { pullRequestId: $id, mergeMethod: SQUASH }
                  ) {
                    pullRequest { autoMergeEnabled }
                  }
                }`,
                { id: pr.node_id }
              );
              core.info(`Auto-merge enabled on PR #${pr.number}`);
            } catch (error) {
              core.warning(
                `Auto-merge 설정 실패: ${error.message}\n` +
                  'GitHub 레포 Settings → General → Allow auto-merge 를 켜거나 PR에서 수동 머지하세요.'
              );
            }
